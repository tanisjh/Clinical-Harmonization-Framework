[pytest]
# Minimal pytest setup for the CIMAC harmonization repository.
# Default collection is portable and synthetic only.
# See tests/README.md for the full command set.
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = scripts tests
addopts = -ra --strict-markers -m "not production_integration and not corpus_acceptance"
markers =
    corpus_acceptance: source-free checks of explicitly supplied approved declaratives
    production_integration: opt-in checks requiring explicitly supplied production artifacts
    slow: test requires a full pipeline run
