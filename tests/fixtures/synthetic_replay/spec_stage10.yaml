spec_id: synthetic/device_stage10_grouping_anchor
spec_version: 1.0.0
project: synthetic_replay
trial: synthetic_device_lab
target_schema: {id: synthetic/device_stage10, version: 1.0.0}
status: approved
description: Grouping-anchor direct strict replay fixture.
sources:
  - id: readings
    path: tests/fixtures/synthetic_replay/sources/stage10_grouping.csv
    file_type: csv
    reader: cidc_csv@v1
    logical_label: stage10_grouping.csv
    record_keys: [cimac_part_id, Cimac.id, Collection_Event]
    participant_column: cimac_part_id
  - id: participants
    path: tests/fixtures/synthetic_replay/sources/stage10_participants.csv
    file_type: csv
    reader: cidc_csv@v1
    logical_label: stage10_participants.csv
    record_keys: [cimac_part_id]
    participant_column: cimac_part_id
  - id: attribution
    path: tests/fixtures/synthetic_replay/sources/stage10_attribution.csv
    file_type: csv
    reader: cidc_csv@v1
    logical_label: stage10_attribution.csv
    record_keys: [cimac_part_id]
    participant_column: cimac_part_id
record:
  anchor: grouping
  anchor_source: readings
  participant_key: cimac_part_id
  sample_key: Cimac.id
  collection_event_key: Collection_Event
  duplicates: {policy: first, by: [cimac_part_id]}
  grouping:
    key_columns: [cimac_part_id, Cimac.id, Collection_Event]
    select: first_row
    anchor_fields:
      cimac_part_id: cimac_part_id
      Cimac.id: Cimac.id
      Collection_Event: Collection_Event
  additional_records:
    - id: missing_reading
      participants_from: participants
      when: no_record_for_participant
      values:
        Cimac.id: SYNTH-000
        Collection_Event: " 7.5 "
      rule: {id: record.no_reading.v1, version: 1, review_status: approved}
mappings:
  - mapping_id: anchor.direct.none
    target: direct_none
    op: direct
    source: $anchor
    column: Collection_Event
    coerce: none
    rule: {id: direct.copy.v1, version: 1, review_status: approved}
    confidence: 1.0
    provenance: {source_ref: attribution, row_number: none}
  - mapping_id: anchor.direct.text
    target: direct_text
    op: direct
    source: $anchor
    column: Collection_Event
    coerce: text
    rule: {id: direct.copy.v1, version: 1, review_status: approved}
    confidence: 0.9
    provenance: {source_ref: attribution, row_number: none}
  - mapping_id: anchor.direct.numeric
    target: direct_numeric
    op: direct
    source: $anchor
    column: Collection_Event
    coerce: numeric
    rule: {id: direct.copy.v1, version: 1, review_status: approved}
    no_value_rule: {id: direct.no_value.v1, version: 1, review_status: approved}
    confidence: {value: 0.8, no_value: 0.2}
    provenance: {source_ref: attribution, row_number: none}
  - mapping_id: anchor.direct.unattributed
    target: direct_unattributed
    op: direct
    source: $anchor
    column: Collection_Event
    coerce: none
    rule: {id: direct.copy.v1, version: 1, review_status: approved}
    confidence: 1.0
  - mapping_id: anchor.value_map.unsupported
    target: anchor_map_unsupported
    op: value_map
    source: $anchor
    column: Collection_Event
    map: {bench west: west, bench-east: east, '42': numeric, '7.5': synthetic}
    on_unmapped: error
    rule: {id: value_map.location.v1, version: 1, review_status: approved}
    confidence: 0.9
