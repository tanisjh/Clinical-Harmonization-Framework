spec_id: synthetic/device_stage5_vocabulary
spec_version: 1.0.0
project: synthetic_replay
trial: synthetic_device_lab
target_schema: {id: synthetic/device_stage5, version: 1.0.0}
status: approved
description: Runtime vocabulary evidence and narrow Stage 2/3 replay fixture.
sources:
  - id: readings
    path: tests/fixtures/synthetic_replay/sources/stage5_readings.csv
    file_type: csv
    reader: cidc_csv@v1
    logical_label: stage5_readings.csv
    record_keys: [device_id, reading_id]
    participant_column: device_id
record:
  anchor: external
  participant_key: device_id
  sample_key: reading_id
  collection_event_key: location
  duplicates: {policy: error, by: [device_id, reading_id]}
mappings:
  - mapping_id: map.inline
    target: inline_label
    op: value_map
    source: readings
    column: inline_code
    map: {EXACT: inline-wins}
    fallback_vocabulary: synthetic/stage5_ordered@1.0.0
    on_unmapped: error
    rule: {id: map.inline.v1, version: 1, review_status: approved}
    no_value_rule: {id: map.no_value.v1, version: 1, review_status: approved}
    unmapped_rule: {id: map.unmapped.v1, version: 1, review_status: approved}
    confidence: {value: 0.91, no_value: 0.41, unmapped: 0.31}
    provenance: {record_key_from: participant, row_number: source}
  - mapping_id: map.overlap
    target: overlap_label
    op: value_map
    source: readings
    column: overlap_code
    map: {}
